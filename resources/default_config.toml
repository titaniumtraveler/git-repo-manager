"$schema" = "./config_schema.json"

[hosts]
gitlab = "git@gitlab.com:${repo/name}.git"

[hosts.github]
host = "ssh://git@github.com/${repo/name}.git"
alias = ["gh"]
default = true

# Default if no storages are configured:
[repo-storages]
default = "$XDG_DATA_HOME/git-repo-manager/"

[checkout-dirs]
default = "~/projects/"
# other = { path = "~/other-projects/", default = false }

[openers]
# Open bash
# The current working directory is automatically set to ${repo-checkout}
default = ["bash"]

[openers.notes]
command = ["bash"]
working-directory = "${repo/file-path}/notes"
